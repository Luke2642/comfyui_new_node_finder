name: Update Node Data

on:
  schedule:
    - cron: '0 6 * * *'  # Daily at 6am UTC
  workflow_dispatch:  # Manual trigger from GitHub UI

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Fetch Registry Data
        run: python fetch_registry.py

      - name: Fetch data
        env:
          # The star read needs a token with public repository read access.
          # A fine-grained PAT needs Repository access set to "Public
          # Repositories". A classic PAT needs the public_repo scope.
          # The built-in GITHUB_TOKEN does not work here: GraphQL answers
          # "Resource not accessible by integration" for every repository
          # outside this one.
          # GH_PAT_STARS is the primary token. GH_PAT_STARS_FALLBACK is
          # optional. The script probes both and uses the first that reads a
          # known public repository.
          GITHUB_TOKEN: ${{ secrets.GH_PAT_STARS }}
          GITHUB_TOKEN_FALLBACK: ${{ secrets.GH_PAT_STARS_FALLBACK }}
        run: python fetch_data.py
      
      - name: Commit changes
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add nodes.js nodes.json
          git diff --staged --quiet || git commit -m "Update node data [skip ci]"
          git push
