name: Update Node Data

on:
  schedule:
    - cron: '0 6 * * *'  # Daily at 6am UTC
  workflow_dispatch:  # Manual trigger from GitHub UI

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Fetch Registry Data
        run: python fetch_registry.py

      - name: Fetch data
        env:
          # GH_PAT_STARS is the dedicated star-read token. GH_PAT is the
          # fallback, because this job already uses it for checkout and push.
          # The built-in GITHUB_TOKEN is not a valid fallback: GraphQL answers
          # "Resource not accessible by integration" for any repository outside
          # this one. The script probes each token and uses the first that
          # reads a public repository, so it never uses GH_PAT when
          # GH_PAT_STARS works.
          GITHUB_TOKEN: ${{ secrets.GH_PAT_STARS }}
          GITHUB_TOKEN_FALLBACK: ${{ secrets.GH_PAT }}
        run: python fetch_data.py
      
      - name: Commit changes
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add nodes.js nodes.json
          git diff --staged --quiet || git commit -m "Update node data [skip ci]"
          git push
